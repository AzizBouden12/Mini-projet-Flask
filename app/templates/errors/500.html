{% extends "base.html" %}
{% block title %}Erreur interne{% endblock %}
{% block content %}
<div class="empty-state error-page">
  <i class="bi bi-bug" aria-hidden="true"></i>
  <p class="error-code mono">500</p>
  <h1>Erreur interne</h1>
  <p>Une erreur inattendue s'est produite. Réessayez dans un instant.</p>
  <div class="d-flex justify-content-center gap-2">
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Retour à l'accueil</a>
    {% if not current_user.is_authenticated %}<a class="btn btn-outline-secondary" href="{{ url_for('user.login') }}">Se connecter</a>{% endif %}
  </div>
</div>
{% endblock %}
