{% extends "base.html" %}
{% block title %}Page introuvable{% endblock %}
{% block content %}
<div class="empty-state error-page">
  <i class="bi bi-signpost-split" aria-hidden="true"></i>
  <p class="error-code mono">404</p>
  <h1>Page introuvable</h1>
  <p>La page demandée n'existe pas ou a été déplacée.</p>
  <div class="d-flex justify-content-center gap-2">
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Retour à l'accueil</a>
    {% if not current_user.is_authenticated %}<a class="btn btn-outline-secondary" href="{{ url_for('user.login') }}">Se connecter</a>{% endif %}
  </div>
</div>
{% endblock %}
